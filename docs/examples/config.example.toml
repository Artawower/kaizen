# JSON Schema: ../schemas/config.schema.json
# Kaizen specification schema version
schema-version = 1

# Fractal Configuration Principle:
# Any section (e.g. [keyboard], [ui], [system]) can be written fully inline in this single file,
# or extracted/inherited from an external file/URL/git via `extends`.
# Local keys in the same section override inherited keys (deep-merge).

[system]
email = "you@example.com"
full_name = "Your Name"

[privacy]
check-hash = true
allow-dependencies = true
ai-validation = true
# w - week, d - day, m - month, y - year
quarantine = "1w"
foss = true # Allow only packages with open-source (FOSS) licenses
allow-post-install = true

# Automatically back up existing files in $HOME / ~/.config before overwriting them
[backup]
enabled = true
directory = "~/.local/share/kaizen/backups"
max-generations = 10

[ui.theme]
name = "catppuccin-mocha"
light = "catppuccin-latte"
dark = "catppuccin-mocha"

[ui.typography]
font_family = "JetBrainsMono Nerd Font"
font_size = 14

[ui.workspaces]
names = [
  "SOC",
  "TERM",
  "WEB",
  "DEV",
  "ENT",
  "OTH",
  "STD",
  "AI",
  "PRD",
  "SYS",
]

[ui.wallpaper]
directory = "~/Pictures/Wallpapers"
directory_light = "~/Pictures/Wallpapers/Light"
directory_dark = "~/Pictures/Wallpapers/Dark"

# Any section can inherit from an external config via `extends` and override specific keys locally
[keyboard]
extends = { path = "./keyboard.example.toml", type = "local" } # "git" | "url" | "local"
use-fn-keys = false
layout = "colemak" # "qwerty" | "dvorak" | "colemak" | "colemak-dh"

# Optional user-level langmap override (e.g. Latin Colemak <-> Russian JCUKEN)
[keyboard.langmap]
extends = { path = "https://github.com/Artawower/kaizen-langmap-colemak-ru", type = "git" }
w = "ц"
s = "в"

[env]
EDITOR = "hx"
VISUAL = "emacsclient"
JJ_EDITOR = "emacsclient -nw"

# Stable terminal alias names are extension points, not tool selections.
# Enabled packages may explicitly provide an implementation for these aliases.
[terminal.aliases.vcs]
description = "Version control system"

[terminal.aliases.skills]
description = "AI skill manager"

[terminal.aliases.ai]
description = "Preferred AI agent launcher"

[terminal.aliases.fm]
description = "File manager"

[terminal.aliases.run]
description = "Run a task from Cargo, Justfile, or Make"

[terminal.aliases.mx]
description = "Terminal multiplexer"

# Model profiles are configuration values for packages that integrate with AI tools;
# they do not select or install the `ai` terminal alias provider.
[ai.models]
low = "antigravity/gemini-3.8-flash"
medium = "openapi-codex/gpt-5.6-sol"
high = "openapi-codex/gpt-6.1-sol"

# Package declarations default to enabled = true; set enabled = false to keep one installed but inactive.

# Registries are discovery catalogs; package manifests remain authoritative.
[[registry]]
name = "community"
source = "https://github.com/kaizen-protocol/registry"
type = "git"
enabled = true

# Presets or packages may also be declared directly inline.
# You can include presets via [[resources]] or declare [[package]] directly inline.
[[resources]]
path = "./preset.example.toml"
type = "local" # "git" | "url" | "local"
