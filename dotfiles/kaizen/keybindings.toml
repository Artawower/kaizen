# Kaizen unified shortcut catalog.
#
# [shortcuts] — base (qwerty-compatible) entries using object format:
#   { keys = [...], group = "...", description = "..." }
#
# [layout.<name>.shortcuts] — overrides as plain arrays merged on top of base.
# kaizen merges overlay at export time; modifier tokens (CTRL/ALT/…) are
# resolved per platform.

[modifiers.darwin]
SUPER = "Cmd"
ALT = "Opt"
WM = "ralt + rshift"
SHIFT = "Shift"
CTRL = "Ctrl"

[modifiers.linux]
SUPER = "Super"
ALT = "Alt"
WM = "Alt+Shift"
SHIFT = "Shift"
CTRL = "Ctrl"

[shortcuts]
# --- Prefix / leader keys ---
"prefix.multiplexer" = { keys = [
  "CTRL",
  "b",
], group = "Prefix", description = "Terminal multiplexer prefix (herdr / zellij)" }
"prefix.editor" = { keys = [
  "space",
], group = "Prefix", description = "Editor leader key (Helix space mode)" }
"prefix.wm" = { keys = [
  "Caps",
], group = "Prefix", description = "Tiling WM modifier key (Aerospace / Niri)" }

# --- Navigation (base = qwerty) ---
"nav.left" = { keys = [
  "h",
], group = "Navigation", description = "Move focus left" }
"nav.down" = { keys = [
  "j",
], group = "Navigation", description = "Move focus down" }
"nav.up" = { keys = ["k"], group = "Navigation", description = "Move focus up" }
"nav.right" = { keys = [
  "l",
], group = "Navigation", description = "Move focus right" }
"nav.insert" = { keys = [
  "i",
], group = "Navigation", description = "Enter insert mode" }
"editor.line.start" = { keys = [
  "0",
], group = "Navigation", description = "Move cursor to line start" }
"editor.line.end" = { keys = [
  "$",
], group = "Navigation", description = "Move cursor to line end" }

# --- VCS ---
"vcs.ui" = { keys = ["v", "l"], group = "VCS", description = "Open VCS UI" }

"vcs.history" = { keys = [
  "v",
  "h",
], group = "VCS", description = "Open VCS history" }

"window.zoom" = { keys = [
  "w",
  "f",
], group = "Window", description = "Zoom/fullscreen current split" }
"window.close" = { keys = [
  "w",
  "q",
], group = "Window", description = "Close current window/pane" }
"window.rotate" = { keys = [
  "w",
  "r",
], group = "Window", description = "Rotate windows/panes" }

# --- File navigation ---
# keys = suffix after space-leader (space prefix added by editor templates)
"file.find" = { keys = [
  "f",
  "f",
], group = "File", description = "Find file in project" }

# --- LSP actions (space l *) ---
# keys = suffix after space-leader
"lsp.rename" = { keys = [
  "l",
  "r",
], group = "LSP", description = "Rename symbol" }
"lsp.action" = { keys = ["l", "a"], group = "LSP", description = "Code action" }
"lsp.format" = { keys = [
  "l",
  "f",
], group = "LSP", description = "Format buffer" }
"lsp.hover" = { keys = [
  "l",
  "h",
], group = "LSP", description = "Show hover docs" }
"lsp.symbols" = { keys = [
  "l",
  "s",
], group = "LSP", description = "Document symbols" }
"lsp.diagnostics" = { keys = [
  "l",
  "d",
], group = "LSP", description = "Diagnostics picker" }

# --- Folding ---
"fold.toggle" = { keys = [
  "z",
  "a",
], group = "Fold", description = "Toggle fold at cursor" }
"fold.toggle-all" = { keys = [
  "z",
  "A",
], group = "Fold", description = "Toggle all folds" }
"fold.open" = { keys = [
  "z",
  "r",
], group = "Fold", description = "Open fold at cursor" }
"fold.open-all" = { keys = [
  "z",
  "R",
], group = "Fold", description = "Open all folds" }
"fold.close-all" = { keys = [
  "z",
  "M",
], group = "Fold", description = "Close all folds" }
"fold.next" = { keys = ["z", "j"], group = "Fold", description = "Next fold" }
"fold.previous" = { keys = [
  "z",
  "k",
], group = "Fold", description = "Previous fold" }

# --- Bookmarks ---
"bookmark.toggle" = { keys = [
  "m",
  "m",
], group = "Bookmark", description = "Toggle bookmark on current line" }
"bookmark.next" = { keys = [
  "]",
  "m",
], group = "Bookmark", description = "Go to next bookmark" }
"bookmark.previous" = { keys = [
  "[",
  "m",
], group = "Bookmark", description = "Go to previous bookmark" }
"bookmark.list" = { keys = [
  "m",
  "l",
], group = "Bookmark", description = "List bookmarks" }

# --- Projects ---
"projects.pick" = { keys = [
  "p",
  "p",
], group = "Projects", description = "Pick project (zoxide)" }

# --- Pane: split ---
"pane.split.right" = { keys = [
  "w",
  "v",
], group = "Pane", description = "Split pane right" }
"pane.split.down" = { keys = [
  "w",
  "h",
], group = "Pane", description = "Split pane down" }

# --- Pane: focus — arrow fallback (terminal-safe, all apps) ---
"pane.focus.left" = { keys = [
  "CTRL",
  "ALT",
  "Left",
], group = "Pane", description = "Focus pane left" }
"pane.focus.right" = { keys = [
  "CTRL",
  "ALT",
  "Right",
], group = "Pane", description = "Focus pane right" }
"pane.focus.up" = { keys = [
  "CTRL",
  "ALT",
  "Up",
], group = "Pane", description = "Focus pane up" }
"pane.focus.down" = { keys = [
  "CTRL",
  "ALT",
  "Down",
], group = "Pane", description = "Focus pane down" }

# --- Pane: focus — nav keys (Ctrl + Alt + hjkl) ---
"app.pane.focus.left" = { keys = [
  "CTRL",
  "ALT",
  "h",
], group = "App Navigation", description = "Focus app pane/view left" }
"app.pane.focus.down" = { keys = [
  "CTRL",
  "ALT",
  "j",
], group = "App Navigation", description = "Focus app pane/view down" }
"app.pane.focus.up" = { keys = [
  "CTRL",
  "ALT",
  "k",
], group = "App Navigation", description = "Focus app pane/view up" }
"app.pane.focus.right" = { keys = [
  "CTRL",
  "ALT",
  "l",
], group = "App Navigation", description = "Focus app pane/view right" }

# --- Pane: move (Ctrl + Alt + Shift + hjkl) ---
"app.pane.move.left" = { keys = [
  "CTRL",
  "ALT",
  "SHIFT",
  "h",
], group = "App Navigation", description = "Move app pane/view left" }
"app.pane.move.down" = { keys = [
  "CTRL",
  "ALT",
  "SHIFT",
  "j",
], group = "App Navigation", description = "Move app pane/view down" }
"app.pane.move.up" = { keys = [
  "CTRL",
  "ALT",
  "SHIFT",
  "k",
], group = "App Navigation", description = "Move app pane/view up" }
"app.pane.move.right" = { keys = [
  "CTRL",
  "ALT",
  "SHIFT",
  "l",
], group = "App Navigation", description = "Move app pane/view right" }

# --- Tab / Buffer: Cmd+Shift + horizontal pair (h=prev, l=next) ---
# Tabs are horizontal → left/right direction keys.
# Known conflicts: Cmd+Shift+N (Finder new folder), Cmd+Shift+I (Inspector) — rebind per app.
"app.tab.previous" = { keys = [
  "SUPER",
  "SHIFT",
  "h",
], group = "App Navigation", description = "Previous app tab/buffer" }
"app.tab.next" = { keys = [
  "SUPER",
  "SHIFT",
  "l",
], group = "App Navigation", description = "Next app tab/buffer" }
"app.tab.switch" = { keys = [
  "SUPER",
  "1..9",
], group = "App Navigation", description = "Switch app tab/buffer by number" }

# --- Workspace / Session: Cmd+Shift + vertical pair (k=prev, j=next) ---
# Workspaces are vertical → up/down direction keys.
"app.workspace.previous" = { keys = [
  "SUPER",
  "SHIFT",
  "k",
], group = "App Navigation", description = "Previous app workspace/session" }
"app.workspace.next" = { keys = [
  "SUPER",
  "SHIFT",
  "j",
], group = "App Navigation", description = "Next app workspace/session" }
"app.workspace.switch" = { keys = [
  "SUPER",
  "SHIFT",
  "1..9",
], group = "App Navigation", description = "Switch app workspace/session by number" }

# --- Pickers ---
"app.projects.pick" = { keys = [
  "ALT",
  "p",
], group = "App Navigation", description = "Pick app project" }
"app.workspaces.pick" = { keys = [
  "ALT",
  "w",
], group = "App Navigation", description = "Pick app workspace" }
"app.tabs.pick" = { keys = [
  "ALT",
  "t",
], group = "App Navigation", description = "Pick app tab" }
"app.buffers.pick" = { keys = [
  "ALT",
  "b",
], group = "App Navigation", description = "Pick app buffer" }

# --- Run
"run.task" = { keys = [
  "space",
  "r",
  "t",
], group = "Run", description = "Run task" }

# --- jjui actions (displaced from nav keys in colemak) ---
"jjui.new" = { keys = ["n"], group = "jjui", description = "New change" }
"jjui.edit" = { keys = ["e"], group = "jjui", description = "Edit change" }
"jjui.interactive" = { keys = [
  "i",
], group = "jjui", description = "Interactive rebase" }

[layout.colemak.shortcuts]
# nav.left = ["h"] — same as base, omitted
"nav.down" = ["n"]
"nav.up" = ["e"]
"nav.right" = ["i"]
"nav.insert" = ["l"]
# Pane focus
"app.pane.focus.down" = ["CTRL", "ALT", "n"]
"app.pane.focus.up" = ["CTRL", "ALT", "e"]
"app.pane.focus.right" = ["CTRL", "ALT", "i"]
# Pane move
"app.pane.move.down" = ["CTRL", "ALT", "SHIFT", "n"]
"app.pane.move.up" = ["CTRL", "ALT", "SHIFT", "e"]
"app.pane.move.right" = ["CTRL", "ALT", "SHIFT", "i"]
# Tab: Cmd+Shift+h/l → Cmd+Shift+h/i
"app.tab.next" = ["SUPER", "SHIFT", "i"]
# Workspace: Cmd+Shift+k/j → Cmd+Shift+e/n
"app.workspace.previous" = ["SUPER", "SHIFT", "e"]
"app.workspace.next" = ["SUPER", "SHIFT", "n"]
# Fold navigation
"fold.next" = ["z", "n"]
"fold.previous" = ["z", "e"]
# jjui
"jjui.new" = ["j"]
"jjui.edit" = ["k"]
"jjui.interactive" = ["l"]
