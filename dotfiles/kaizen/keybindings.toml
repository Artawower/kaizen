# Kaizen unified shortcut catalog.
#
# [shortcuts] — base (qwerty-compatible) entries using object format:
#   { keys = [...], group = "...", description = "..." }
#
# [layout.<name>.shortcuts] — overrides as plain arrays merged on top of base.
# kaizen merges overlay at export time; modifier tokens (CTRL/ALT/…) are
# resolved per platform.

[modifiers.darwin]
SUPER = "Cmd"
ALT = "Opt"
WM = "ralt + rshift"
SHIFT = "Shift"
CTRL = "Ctrl"

[modifiers.linux]
SUPER = "Super"
ALT = "Alt"
WM = "Alt+Shift"
SHIFT = "Shift"
CTRL = "Ctrl"

[shortcuts]
# --- Navigation (base = qwerty) ---
"nav.left" = { keys = [
  "h",
], group = "Navigation", description = "Move focus left" }
"nav.down" = { keys = [
  "j",
], group = "Navigation", description = "Move focus down" }
"nav.up" = { keys = ["k"], group = "Navigation", description = "Move focus up" }
"nav.right" = { keys = [
  "l",
], group = "Navigation", description = "Move focus right" }

# --- VCS ---
"vcs.ui" = { keys = [
  "g",
  "g",
], group = "VCS", description = "Open VCS UI (jjui)" }

# --- Projects ---
"projects.pick" = { keys = [
  "p",
  "p",
], group = "Projects", description = "Pick project (zoxide)" }

# --- Pane: split ---
"pane.split.right" = { keys = [
  "w",
  "v",
], group = "Pane", description = "Split pane right" }
"pane.split.down" = { keys = [
  "w",
  "s",
], group = "Pane", description = "Split pane down" }

# --- Pane: focus (arrow fallback, terminal-safe) ---
"pane.focus.left" = { keys = [
  "CTRL",
  "ALT",
  "Left",
], group = "Pane", description = "Focus pane left" }
"pane.focus.right" = { keys = [
  "CTRL",
  "ALT",
  "Right",
], group = "Pane", description = "Focus pane right" }
"pane.focus.up" = { keys = [
  "CTRL",
  "ALT",
  "Up",
], group = "Pane", description = "Focus pane up" }
"pane.focus.down" = { keys = [
  "CTRL",
  "ALT",
  "Down",
], group = "Pane", description = "Focus pane down" }

# --- Pane: focus (Ctrl + Alt + nav) ---
"app.pane.focus.left" = { keys = [
  "CTRL",
  "ALT",
  "h",
], group = "App Navigation", description = "Focus app pane/view left" }
"app.pane.focus.down" = { keys = [
  "CTRL",
  "ALT",
  "j",
], group = "App Navigation", description = "Focus app pane/view down" }
"app.pane.focus.up" = { keys = [
  "CTRL",
  "ALT",
  "k",
], group = "App Navigation", description = "Focus app pane/view up" }
"app.pane.focus.right" = { keys = [
  "CTRL",
  "ALT",
  "l",
], group = "App Navigation", description = "Focus app pane/view right" }

# --- Pane: move (Ctrl + Alt + Shift + nav) ---
"app.pane.move.left" = { keys = [
  "CTRL",
  "ALT",
  "SHIFT",
  "h",
], group = "App Navigation", description = "Move app pane/view left" }
"app.pane.move.down" = { keys = [
  "CTRL",
  "ALT",
  "SHIFT",
  "j",
], group = "App Navigation", description = "Move app pane/view down" }
"app.pane.move.up" = { keys = [
  "CTRL",
  "ALT",
  "SHIFT",
  "k",
], group = "App Navigation", description = "Move app pane/view up" }
"app.pane.move.right" = { keys = [
  "CTRL",
  "ALT",
  "SHIFT",
  "l",
], group = "App Navigation", description = "Move app pane/view right" }

# --- Tab / Buffer: Cmd + Alt + vertical pair ---
# Linear navigation: k = previous, j = next.
"app.tab.previous" = { keys = [
  "SUPER",
  "ALT",
  "k",
], group = "App Navigation", description = "Previous app tab/buffer" }
"app.tab.next" = { keys = [
  "SUPER",
  "ALT",
  "j",
], group = "App Navigation", description = "Next app tab/buffer" }
"app.tab.switch" = { keys = [
  "SUPER",
  "1..9",
], group = "App Navigation", description = "Switch app tab/buffer by number" }

# --- Workspace / Session: Ctrl + vertical pair (app-level only) ---
# Ctrl+j/k conflict with readline in raw terminal — register only in GUI app keymaps.
"app.workspace.previous" = { keys = [
  "CTRL",
  "k",
], group = "App Navigation", description = "Previous app workspace/session (app-level only)" }
"app.workspace.next" = { keys = [
  "CTRL",
  "j",
], group = "App Navigation", description = "Next app workspace/session (app-level only)" }
"app.workspace.switch" = { keys = [
  "CTRL",
  "1..9",
], group = "App Navigation", description = "Switch app workspace/session by number" }

# --- Pickers ---
"app.projects.pick" = { keys = [
  "ALT",
  "p",
], group = "App Navigation", description = "Pick app project" }
"app.workspaces.pick" = { keys = [
  "ALT",
  "w",
], group = "App Navigation", description = "Pick app workspace" }
"app.tabs.pick" = { keys = [
  "ALT",
  "t",
], group = "App Navigation", description = "Pick app tab" }
"app.buffers.pick" = { keys = [
  "ALT",
  "b",
], group = "App Navigation", description = "Pick app buffer" }

# --- jjui actions (displaced from nav keys in colemak) ---
"jjui.new" = { keys = ["n"], group = "jjui", description = "New change" }
"jjui.edit" = { keys = ["e"], group = "jjui", description = "Edit change" }
"jjui.interactive" = { keys = [
  "i",
], group = "jjui", description = "Interactive rebase" }

[layout.colemak.shortcuts]
# nav.left = ["h"] — same as base, omitted
"nav.down" = ["n"]
"nav.up" = ["e"]
"nav.right" = ["i"]

# Pane focus
"app.pane.focus.down" = ["CTRL", "ALT", "n"]
"app.pane.focus.up" = ["CTRL", "ALT", "e"]
"app.pane.focus.right" = ["CTRL", "ALT", "i"]

# Pane move
"app.pane.move.down" = ["CTRL", "ALT", "SHIFT", "n"]
"app.pane.move.up" = ["CTRL", "ALT", "SHIFT", "e"]
"app.pane.move.right" = ["CTRL", "ALT", "SHIFT", "i"]

# Tab layer: Cmd+Alt+k/j → Cmd+Alt+e/n
"app.tab.previous" = ["SUPER", "ALT", "e"]
"app.tab.next" = ["SUPER", "ALT", "n"]

# Workspace layer: Ctrl+k/j → Ctrl+e/n
"app.workspace.previous" = ["CTRL", "e"]
"app.workspace.next" = ["CTRL", "n"]

# jjui
"jjui.new" = ["j"]
"jjui.edit" = ["k"]
"jjui.interactive" = ["l"]
