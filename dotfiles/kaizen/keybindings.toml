# Kaizen unified shortcut catalog.
#
# [shortcuts] defines base (qwerty-compatible) shortcuts. Each entry is an
# array of string tokens. Tokens matching a key in [modifiers.*] are resolved
# to their platform-native name at export time. All other tokens pass through.
#
# [layout.<name>.shortcuts] defines overrides applied on top of base for that
# layout. kaizen merges overlay on top of base at export time.
#
# Accepted shortcuts:
#   nav.*              navigation keys (layout-aware via colemak overlay)
#   jjui.*             jjui action keys (displaced to j/k/l in colemak)
#   projects.pick      ["p","p"]
#   pane.split.*       pane split shortcuts
#   vcs.ui             ["g","g"]
#   pane.focus.*       ["CTRL","ALT",…] global terminal-safe shortcuts

[modifiers.darwin]
SUPER = "Cmd"
ALT = "Opt"
WM = "ralt + rshift"
SHIFT = "Shift"
CTRL = "Ctrl"

[modifiers.linux]
SUPER = "Super"
ALT = "Alt"
WM = "Alt+Shift"
SHIFT = "Shift"
CTRL = "Ctrl"

[shortcuts]
# --- Navigation (base = qwerty) ---
"nav.left" = ["h"]
"nav.down" = ["j"]
"nav.up" = ["k"]
"nav.right" = ["l"]

# --- jjui actions (displaced from nav keys in colemak) ---
"jjui.new" = ["n"]
"jjui.edit" = ["e"]
"jjui.interactive" = ["i"]

# --- VCS ---
"vcs.ui" = ["g", "g"]

# --- Projects ---
"projects.pick" = ["p", "p"]

# --- Pane: split ---
"pane.split.right" = ["w", "v"]
"pane.split.down" = ["w", "s"]

# --- Pane: focus (global, terminal-safe) ---
"pane.focus.left" = ["CTRL", "ALT", "Left"]
"pane.focus.right" = ["CTRL", "ALT", "Right"]
"pane.focus.up" = ["CTRL", "ALT", "Up"]
"pane.focus.down" = ["CTRL", "ALT", "Down"]

[layout.colemak.shortcuts]
# nav.left = ["h"] — same as base, omitted
"nav.down" = ["n"]
"nav.up" = ["e"]
"nav.right" = ["i"]
"jjui.new" = ["j"]
"jjui.edit" = ["k"]
"jjui.interactive" = ["l"]
