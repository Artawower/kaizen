[language-server.ty]
command = "ty"
args = ["server"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.codebook]
command = "codebook-lsp"
args = ["serve"]

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]
config.hostInfo = "helix"
config.tsserver.fallbackPath = "tsserver"

[language-server.angular]
command = "ngserver"
args = [
  "--stdio",
  "--tsProbeLocations",
  ".",
  "--ngProbeLocations",
  ".",
]
required-root-patterns = ["angular.json"]

[language-server.vue-language-server]
command = "vue-language-server"
args = ["--stdio"]

[language-server.vue-language-server.config.typescript]
tsdk = "node_modules/typescript/lib"

[language-server.vue-language-server.config.vue]
hybridMode = false

[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]

[language-server.vscode-eslint-language-server]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.vscode-eslint-language-server.config]
validate = "on"
run = "onType"

[language-server.copilot]
command = "copilot-language-server"
args = ["--stdio"]

[language-server.copilot.config]
editorInfo = { name = "Helix", version = "25.07.1" }
editorPluginInfo = { name = "helix-copilot", version = "0.1.0" }

[language-server.gopls]
command = "gopls"
config.ui.completion.usePlaceholders = true

[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.lua-language-server]
command = "lua-language-server"
config.Lua.runtime.version = "LuaJIT"

[language-server.vscode-css-language-server]
command = "vscode-css-language-server"
args = ["--stdio"]

[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]

[language-server.yaml-language-server.config.yaml.schemas]
"https://json.schemastore.org/github-workflow" = ".github/workflows/*"
"https://json.schemastore.org/kustomization" = "kustomization.{yml,yaml}"
"https://raw.githubusercontent.com/kubernetes/kubernetes/master/api/openapi-spec/swagger.json" = "*.k8s.{yml,yaml}"

[language-server.marksman]
command = "marksman"
args = ["server"]

[language-server.csharp-language-server]
command = "csharp-ls"
args = ["-v", "-loglevel", "trace"]

[[language]]
name = "python"
roots = [
  "pyproject.toml",
  "uv.lock",
  "requirements.txt",
  "setup.py",
  "setup.cfg",
]
language-servers = [
  "ty",
  { name = "ruff", only-features = ["diagnostics", "pull-diagnostics", "code-action", "format"] },
  { name = "copilot", only-features = ["completion"] },
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "javascript"
roots = ["package.json", "jsconfig.json", "tsconfig.json"]
language-servers = [
  "typescript-language-server",
  { name = "vscode-eslint-language-server", only-features = ["diagnostics", "code-action"] },
  { name = "copilot", only-features = ["completion"] },
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "jsx"
roots = ["package.json", "jsconfig.json", "tsconfig.json"]
language-servers = [
  "typescript-language-server",
  { name = "vscode-eslint-language-server", only-features = ["diagnostics", "code-action"] },
  { name = "copilot", only-features = ["completion"] },
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "typescript"
roots = ["angular.json", "package.json", "tsconfig.json"]
language-servers = [
  "typescript-language-server",
  "angular",
  { name = "vscode-eslint-language-server", only-features = ["diagnostics", "code-action"] },
  { name = "copilot", only-features = ["completion"] },
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "tsx"
roots = ["package.json", "tsconfig.json"]
language-servers = [
  "typescript-language-server",
  { name = "vscode-eslint-language-server", only-features = ["diagnostics", "code-action"] },
  { name = "copilot", only-features = ["completion"] },
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "vue"
roots = ["package.json", "tsconfig.json"]
language-servers = [
  "vue-language-server",
  { name = "vscode-eslint-language-server", only-features = ["diagnostics", "code-action"] },
  { name = "copilot", only-features = ["completion"] },
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "html"
roots = ["angular.json", "package.json"]
language-servers = [
  "vscode-html-language-server",
  "angular",
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "go"
roots = ["go.work", "go.mod"]
language-servers = ["gopls"]
auto-format = true
formatter = { command = "gofmt" }
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "rust"
roots = ["Cargo.toml", "Cargo.lock"]
language-servers = ["rust-analyzer"]
auto-format = true
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "lua"
language-servers = [
  "lua-language-server",
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "css"
language-servers = [
  "vscode-css-language-server",
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "scss"
language-servers = [
  "vscode-css-language-server",
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "c-sharp"
language-servers = [
  "csharp-language-server",
  { name = "codebook", only-features = ["diagnostics", "code-action"] },
]

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "markdown"
language-servers = ["marksman"]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "toml"
language-servers = [{ name = "copilot", only-features = ["completion"] }]
auto-format = true
indent = { tab-width = 2, unit = "  " }
