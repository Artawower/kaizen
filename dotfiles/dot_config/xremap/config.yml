modmap:
  - name: CapsLock as compositor modifier and layout switch
    remap:
      CapsLock:
        held: [Alt_R, Shift_R]
        alone: CapsLock
        alone_timeout_millis: 200

keymap:
  - name: Ctrl+Super arrows
    exact_match: true
    remap:
      Ctrl-Super-h: Left
      Ctrl-Super-Shift-h: Shift-Left
      Ctrl-Super-j: Down
      Ctrl-Super-k: Up
      Ctrl-Super-l: Right
      Ctrl-Super-Shift-j: Shift-Down
      Ctrl-Super-Shift-k: Shift-Up
      Ctrl-Super-Shift-l: Shift-Right

  - name: Super clicks as Ctrl clicks
    remap:
      Super-BTN_LEFT: C-BTN_LEFT
      Super-BTN_MIDDLE: C-BTN_MIDDLE
      Super-BTN_RIGHT: C-BTN_RIGHT

  - name: Common Super shortcuts
    application:
      not: [Emacs, neomacs, emacs, emacs-31-1, "app.zen_browser.zen", zen, org.gnu.Emacs, zen-browser, codium, vscodium, VSCodium, "com.vscodium.codium", "codium-url-handler", alacritty, kitty, wezterm, "org.wezfurlong.wezterm", app.kde.konsole, konsole, ghostty, "com.mitchellh.ghostty"]
    exact_match: true
    remap:
      Super-c: C-c
      Super-v: Shift-Insert
      Super-x: C-x
      Super-z: C-z
      Super-a: C-a
      Super-f: C-f
      Super-l: C-l
      Super-t: C-t
      Super-w: C-w
      Super-r: C-r
      Super-s: C-s
      Super-n: C-n
      Super-q: C-q

  - name: Terminals commands
    application:
      only: [alacritty, kitty, wezterm, "org.wezfurlong.wezterm", app.kde.konsole, konsole, ghostty, "com.mitchellh.ghostty"]
    remap:
      Super-v: Shift-Insert
      Super-c: C-Shift-c
      Super-z: C-Shift-z

  - name: Terminal word deletion
    application:
      only: [alacritty, kitty, wezterm, "org.wezfurlong.wezterm", app.kde.konsole, konsole]
    remap:
      Alt-Backspace: C-w
      Alt-Delete: C-w

  - name: Alt-Backspace delete word
    application:
      not: [Emacs, neomacs, emacs, ghostty, "com.mitchellh.ghostty"]
    remap:
      Alt-Backspace: C-Backspace

  - name: Delete
    application:
      not: [Emacs, neomacs, emacs]
    remap:
      Super-Backspace: [Shift-Home, Backspace]
      Super-Left: Home
      Super-Right: End
      Super-Up: C-Home
      Super-Down: C-End
      Super-Shift-Left: [Shift-Home]
      Super-Shift-Right: [Shift-End]
      Super-Shift-Up: [C-Shift-Home]
      Super-Shift-Down: [C-Shift-End]
      Alt-Left: C-Left
      Alt-Right: C-Right
      Alt-Shift-Left: [C-Shift-Left]
      Alt-Shift-Right: [C-Shift-Right]

  - name: GUI shortcuts
    application:
      only: [brave-browser, org.mozilla.firefox, "app.zen_browser.zen", zen, helium, org.telegram.desktop]
    remap:
      C-j: C-Tab
      C-k: C-Shift-Tab
      Alt-Left: Home
      Alt-Right: End
      Super-a: C-a
      Super-c: C-c
      Super-v: Shift-Insert
      Super-z: C-z
      Super-Shift-t: C-Shift-t

  - name: Browser shortcuts
    application:
      only: [brave-browser, org.mozilla.firefox, "app.zen_browser.zen", zen, helium]
    exact_match: true
    remap:
      Super-t: C-t
      Super-f: C-f
      Super-g: C-g
      Super-r: C-r
      Super-p: C-p
      Super-e: C-e

      Super-1: C-1
      Super-2: C-2
      Super-3: C-3
      Super-4: C-4
      Super-5: C-5
      Super-6: C-6
      Super-7: C-7
      Super-8: C-8
      Super-9: C-9
      Super-z: C-z



  - name: Fn tabs
    remap:
      Fn-j: C-Tab
      Fn-k: C-S-Tab

  - name: Emacs
    application:
      only: [emacs, emacs-31-1]
    remap:
      S-k: S-k
      Super-c: Super-c
      Super-v: Super-v
      # Super-Dot: Super-Dot
