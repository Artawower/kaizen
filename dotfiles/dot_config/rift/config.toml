[modifier_combinations]
nav = "Alt + Shift"
move = "Ctrl + Alt + Shift"
resize = "Ctrl + Meta + Alt + Shift"

[keys]

# -----------------------------------------------------------------------------
# Layouts
# -----------------------------------------------------------------------------
# AeroSpace "tiles" -> Rift traditional.

# Closest equivalent to AeroSpace accordion.

# Toggle float / tiled.
"Ctrl + Alt + Shift + C" = "toggle_window_floating"

# Toggle stack around current selection.
"Ctrl + Alt + Shift + V" = "toggle_stack"

# Fast workspace layout selection.
# Primary layer: Alt+Shift, consistent with workspace/navigation bindings.
"Alt + Shift + V" = { set_workspace_layout = { mode = "stack" } }
"Alt + Shift + Comma" = { set_workspace_layout = { mode = "bsp" } }
"Alt + Shift + Dot" = { set_workspace_layout = { mode = "master_stack" } }
"Alt + Shift + Slash" = { set_workspace_layout = { mode = "scrolling" } }

# Traditional split helpers.
"Alt + Shift + B" = { set_workspace_layout = { mode = "traditional" } }
"Alt + Shift + O" = "toggle_orientation"

# Fullscreen.
"Alt + Shift + F" = "toggle_fullscreen"
# Rift does not expose a distinct macOS-native-fullscreen command in the current
# keybinding reference. Keeping this as Rift's within-gaps fullscreen.
"Ctrl + Alt + Shift + F" = "toggle_fullscreen_within_gaps"

# -----------------------------------------------------------------------------
#   focus left/right; if no neighbor -> previous/next workspace.
# -----------------------------------------------------------------------------
"Alt + Shift + H" = { exec = ["sh", "-c", "~/.config/rift/scripts/focus-edge.sh left"] }
"Alt + Shift + L" = { exec = ["sh", "-c", "~/.config/rift/scripts/focus-edge.sh right"] }

"Alt + Shift + J" = { move_focus = "down" }
"Alt + Shift + K" = { move_focus = "up" }

# -----------------------------------------------------------------------------
# Move windows
# -----------------------------------------------------------------------------
"Ctrl + Alt + Shift + H" = { move_node = "left" }
"Ctrl + Alt + Shift + J" = { move_node = "down" }
"Ctrl + Alt + Shift + K" = { move_node = "up" }
"Ctrl + Alt + Shift + L" = { move_node = "right" }

# -----------------------------------------------------------------------------
# Resize
# Rift's native resizing is smart/generic rather than width-vs-height ±40 px.
# These preserve the ergonomic chord, not exact pixel semantics.
# -----------------------------------------------------------------------------
"Ctrl + Meta + Alt + Shift + H" = "resize_window_shrink"
"Ctrl + Meta + Alt + Shift + J" = "resize_window_grow"
"Ctrl + Meta + Alt + Shift + K" = "resize_window_shrink"
"Ctrl + Meta + Alt + Shift + L" = "resize_window_grow"

# -----------------------------------------------------------------------------
# Workspace switching: 0-based Rift indices
# -----------------------------------------------------------------------------
"Alt + Shift + 1" = { switch_to_workspace = 0 }
"Alt + Shift + 2" = { switch_to_workspace = 1 }
"Alt + Shift + 3" = { switch_to_workspace = 2 }
"Alt + Shift + 4" = { switch_to_workspace = 3 }
"Alt + Shift + 5" = { switch_to_workspace = 4 }
"Alt + Shift + 6" = { switch_to_workspace = 5 }
"Alt + Shift + 7" = { switch_to_workspace = 6 }
"Alt + Shift + 8" = { switch_to_workspace = 7 }
"Alt + Shift + 9" = { switch_to_workspace = 8 }
"Alt + Shift + 0" = { switch_to_workspace = 9 }
"Alt + Shift + Minus" = { switch_to_workspace = 10 }
"Alt + Shift + Equal" = { switch_to_workspace = 11 }

# Named workspace aliases: the first letter of each workspace name.
"Alt + Shift + T" = { switch_to_workspace = 1 }
"Alt + Shift + W" = { switch_to_workspace = 2 }
"Alt + Shift + S" = { switch_to_workspace = 0 }
"Alt + Shift + D" = { switch_to_workspace = 3 }
"Alt + Shift + A" = { switch_to_workspace = 7 }
"Alt + Shift + E" = { switch_to_workspace = 6 }
"Alt + Shift + M" = { switch_to_workspace = 4 }
"Alt + Shift + P" = { switch_to_workspace = 5 }
"Alt + Shift + R" = { switch_to_workspace = 8 }
"Alt + Shift + N" = { switch_to_workspace = 9 }


# -----------------------------------------------------------------------------
# Move window to workspace + follow
# -----------------------------------------------------------------------------
"Ctrl + Alt + Shift + 1" = { move_window_to_workspace = { workspace = 0, follow = true } }
"Ctrl + Alt + Shift + 2" = { move_window_to_workspace = { workspace = 1, follow = true } }
"Ctrl + Alt + Shift + 3" = { move_window_to_workspace = { workspace = 2, follow = true } }
"Ctrl + Alt + Shift + 4" = { move_window_to_workspace = { workspace = 3, follow = true } }
"Ctrl + Alt + Shift + 5" = { move_window_to_workspace = { workspace = 4, follow = true } }
"Ctrl + Alt + Shift + 6" = { move_window_to_workspace = { workspace = 5, follow = true } }
"Ctrl + Alt + Shift + 7" = { move_window_to_workspace = { workspace = 6, follow = true } }
"Ctrl + Alt + Shift + 8" = { move_window_to_workspace = { workspace = 7, follow = true } }
"Ctrl + Alt + Shift + 9" = { move_window_to_workspace = { workspace = 8, follow = true } }
"Ctrl + Alt + Shift + 0" = { move_window_to_workspace = { workspace = 9, follow = true } }
"Ctrl + Alt + Shift + Minus" = { move_window_to_workspace = { workspace = 10, follow = true } }
"Ctrl + Alt + Shift + Equal" = { move_window_to_workspace = { workspace = 11, follow = true } }

"Ctrl + Alt + Shift + T" = { move_window_to_workspace = { workspace = 1, follow = true } }
"Ctrl + Alt + Shift + W" = { move_window_to_workspace = { workspace = 2, follow = true } }
"Ctrl + Alt + Shift + S" = { move_window_to_workspace = { workspace = 0, follow = true } }
"Ctrl + Alt + Shift + D" = { move_window_to_workspace = { workspace = 3, follow = true } }
"Ctrl + Alt + Shift + A" = { move_window_to_workspace = { workspace = 7, follow = true } }
"Ctrl + Alt + Shift + E" = { move_window_to_workspace = { workspace = 6, follow = true } }
"Ctrl + Alt + Shift + P" = { move_window_to_workspace = { workspace = 5, follow = true } }
"Ctrl + Alt + Shift + R" = { move_window_to_workspace = { workspace = 8, follow = true } }


# -----------------------------------------------------------------------------
# Launchers
# -----------------------------------------------------------------------------
"Alt + Shift + Enter" = { exec = ["sh", "-c", "open -na Ghostty.app"] }
"Ctrl + Alt + Shift + Enter" = { exec = ["sh", "-c", "open -na Ghostty.app"] }

"Meta + Alt + F" = { exec = ["sh", "-c", "open -a Firefox.app"] }
"Meta + Alt + W" = { exec = ["sh", "-c", "open -na Firefox.app"] }
"Meta + Alt + T" = { exec = ["sh", "-c", "open -a Telegram.app"] }
"Meta + Shift + W" = { exec = ["sh", "-c", "open -a Marta.app"] }
"Meta + Alt + R" = { exec = ["sh", "-c", "open -na kitty.app --args ranger"] }
"Meta + Alt + V" = { exec = ["sh", "-c", "open -na kitty.app --args nvim"] }
"Meta + Alt + M" = { exec = ["sh", "-c", "open -na kitty.app --args spt"] }

# -----------------------------------------------------------------------------
# Close / join
# -----------------------------------------------------------------------------
"Alt + Shift + Q" = "close_window"
"Ctrl + Alt + Shift + Q" = "close_window"

"Meta + Ctrl + Left" = { join_window = "left" }
"Meta + Ctrl + Down" = { join_window = "down" }
"Meta + Ctrl + Up" = { join_window = "up" }
"Meta + Ctrl + Right" = { join_window = "right" }

# -----------------------------------------------------------------------------
# Wallpaper helpers
# -----------------------------------------------------------------------------
"Ctrl + Alt + Shift + N" = { exec = ["sh", "-c", "nohup /opt/homebrew/bin/wallboy next >> /tmp/wallboy.log 2>&1 &"] }
"Ctrl + Alt + Shift + B" = { exec = ["/opt/homebrew/bin/wallboy", "save"] }
"Ctrl + Alt + Shift + O" = { exec = ["/opt/homebrew/bin/wallboy", "open"] }

# -----------------------------------------------------------------------------
# Useful Rift-specific bindings
# -----------------------------------------------------------------------------
"Alt + Shift + Backslash" = "switch_to_last_workspace"
"Alt + Shift + G" = "toggle_stack"

# Reload config explicitly (hot_reload is also enabled).
"Ctrl + Meta + Alt + Shift + R" = "reload_config"

# Rift Mission Control.
"Ctrl + Alt + Shift + M" = "show_mission_control_current"
"Ctrl + Meta + Alt + Shift + M" = "show_mission_control_all"

# Gestures
[settings.gestures]
enabled = true
consume_dock_swipe = true
invert_horizontal_swipe = false
skip_empty = true
fingers = 3
haptics_enabled = true

[settings.layout.scrolling.gestures]
enabled = true
invert_horizontal = true
fingers = 4
distance_pct = 0.08
propagate_to_workspace_swipe = true
workspace_switch_threshold = 0.625
