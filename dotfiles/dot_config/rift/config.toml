# Migrated from AeroSpace config for Rift
# Target path: ~/.config/rift/config.toml
#
# Notes:
# - Workspace indices are 0-based in Rift.
# - AeroSpace "service mode" has no direct Rift equivalent; see README.
# - Edge focus fallback is implemented via helper scripts.

[settings]
animate = false
animation_duration = 0.18
animation_fps = 120.0
mouse_follows_focus = true
focus_follows_mouse = false
mouse_hides_on_focus = false
default_disable = false
hot_reload = true

[settings.layout]
mode = "traditional"
window_insertion_point = "next_to_selection"

[settings.layout.stack]
stack_offset = 20.0
default_orientation = "vertical"

[settings.layout.gaps.outer]
top = 14
left = 24
bottom = 24
right = 24

[settings.layout.gaps.inner]
horizontal = 20
vertical = 20

[settings.ui.menu_bar]
enabled = true
show_empty = false
mode = "active"
active_label = "name"
display_style = "label"
layout_folder = "~/.config/rift/layouts"


[settings.ui.stack_line]
enabled = true
thickness = 3
horiz_placement = "top"
vert_placement = "left"
spacing = 2

[virtual_workspaces]
enabled = true
default_workspace_count = 12
default_workspace = 0
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
reapply_app_rules_on_title_change = true

workspace_names = [
  "SOC", "TRM", "WEB", "DEV", "MED", "PLN",
  "EDU", "AI", "REC", "NET", "11", "12",
]

# Keep all workspaces close to the AeroSpace tiling behavior.
# No per-workspace layout rules: each workspace starts with settings.layout.mode
# and can then be switched at runtime with the bindings below.
workspace_rules = []

