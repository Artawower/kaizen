# HNEI (colemak) / HJKL (qwerty) keybindings for jjui
# Layout: qwerty

# --- Navigation ---

[[bindings]]
action = "revisions.move_down"
key = "j"
scope = "revisions"
desc = "down"

[[bindings]]
action = "revisions.move_up"
key = "k"
scope = "revisions"
desc = "up"

[[bindings]]
action = "revisions.open_details"
key = "l"
scope = "revisions"
desc = "details"

[[bindings]]
action = "revset.edit"
key = "shift+l"
scope = "revisions"
desc = "revset"

# --- Displaced keys ---

[[bindings]]
action = "revisions.new"
key = "n"
scope = "revisions"
desc = "new"

[[bindings]]
action = "revisions.edit"
key = "e"
scope = "revisions"
desc = "edit"

