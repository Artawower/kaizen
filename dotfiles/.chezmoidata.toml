[kaizen.shortcut_descriptions]
"app.buffers.pick" = "Select an open buffer or document."
"app.pane.focus.down" = "Focus the pane below without moving its content."
"app.pane.focus.left" = "Focus the pane to the left without moving its content."
"app.pane.focus.right" = "Focus the pane to the right without moving its content."
"app.pane.focus.up" = "Focus the pane above without moving its content."
"app.pane.move.down" = "Move the current document or pane content toward the pane below."
"app.pane.move.left" = "Move the current document or pane content toward the pane to the left."
"app.pane.move.right" = "Move the current document or pane content toward the pane to the right."
"app.pane.move.up" = "Move the current document or pane content toward the pane above."
"app.projects.pick" = "Choose a project to open or activate."
"app.tab.next" = "Activate the next tab or document in the current pane."
"app.tab.previous" = "Activate the previous tab or document in the current pane."
"app.tab.switch" = "Activate the tab identified by its one-based index."
"app.tabs.pick" = "Choose a tab from an interactive list."
"app.workspace.next" = "Activate the next application workspace or project, not an OS workspace."
"app.workspace.previous" = "Activate the previous application workspace or project, not an OS workspace."
"app.workspace.switch" = "Activate the application workspace identified by its one-based index."
"app.workspaces.pick" = "Choose an application workspace from an interactive list."
"bookmark.list" = "Show bookmarks and jump to a chosen bookmark."
"bookmark.next" = "Jump to the next bookmark."
"bookmark.previous" = "Jump to the previous bookmark."
"bookmark.toggle" = "Toggle a bookmark on the current location or item."
"editor.line.end" = "Move the cursor to the end of the current line."
"editor.line.start" = "Move the cursor to the beginning of the current line."
"file.find" = "Find and open a file in the current project."
"fold.close-all" = "Close all folds in the current document."
"fold.next" = "Move to the next fold."
"fold.open" = "Open the fold at the current location."
"fold.open-all" = "Open all folds in the current document."
"fold.previous" = "Move to the previous fold."
"fold.toggle" = "Toggle the fold at the current location."
"fold.toggle-all" = "Toggle all folds in the current document."
"jjui.edit" = "Edit the selected Jujutsu revision."
"jjui.interactive" = "Select changes interactively during a Jujutsu squash operation."
"jjui.new" = "Create a new Jujutsu revision from the selected revision."
"lsp.action" = "Choose and execute a language-server code action."
"lsp.diagnostics" = "List diagnostics for the current document."
"lsp.format" = "Format the current document or active selection."
"lsp.hover" = "Show documentation or type information at the cursor."
"lsp.rename" = "Rename the symbol at the cursor through the language server."
"lsp.symbols" = "List symbols in the current document and jump to one."
"nav.down" = "Move the cursor or list selection one step down, not the OS window focus."
"nav.insert" = "Enter text insertion mode at the current location."
"nav.left" = "Move the cursor one character left, or select the preceding item on a horizontal surface."
"nav.right" = "Move the cursor one character right, or select the following item on a horizontal surface."
"nav.up" = "Move the cursor or list selection one step up, not the OS window focus."
"pane.focus.down" = "Focus the pane below without moving its content."
"pane.focus.left" = "Focus the pane to the left without moving its content."
"pane.focus.right" = "Focus the pane to the right without moving its content."
"pane.focus.up" = "Focus the pane above without moving its content."
"pane.split.down" = "Create a horizontal split with a view below the current view."
"pane.split.right" = "Create a vertical split with a view to the right of the current view."
"prefix.editor" = "Activate the editor command layer."
"prefix.multiplexer" = "Activate the multiplexer command layer."
"prefix.wm" = "Activate the window-manager command layer."
"projects.pick" = "Choose a project to open or activate."
"run.task" = "Choose and run a project task."
"vcs.history" = "Inspect the version history of the current file."
"vcs.ui" = "Open an interactive version-control interface for the current project."
"window.close" = "Close the current buffer, item, or view without quitting the entire application."
"window.rotate" = "Rotate the arrangement of panes."
"window.zoom" = "Toggle expansion of the current pane and restore the previous layout on unzoom."

