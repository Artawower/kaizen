[workspace]
resolver = "3"
members = [
  "crates/kaizen-core",
  "crates/kaizen-app",
  "apps/kaizen-cli",
]
default-members = [
  "crates/kaizen-core",
  "crates/kaizen-app",
  "apps/kaizen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
validator = { version = "0.20", features = ["derive"] }
regex = "1.11"
