[package]
name = "kaizen-cli"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "kaizen"
path = "src/main.rs"

[dependencies]
kaizen-core = { path = "../kaizen-core" }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
owo-colors = "4"
which = "7"
serde_json = "1.0.149"
colog = "1.4.0"
log = "0.4.29"
terminal_size = "0.4.4"
crossterm = "0.29.0"
dialoguer = "0.12.0"
toml.workspace = true

[dev-dependencies]
tempfile = "3"
