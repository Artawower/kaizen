# ~/.config/kaizen/config.toml
# Generated by: kaizen setup

# --- Core utilities ---------------------------------------------------------
# git, ripgrep, fd, fzf, jq, yq, zoxide, zsh
[features.core]
enabled = true

# --- Frontend ----------------------------------------------------------------
# node, pnpm, TypeScript LSP, Vue/Angular LSP
# disabled_atoms = ["eslint"]   # uncomment to skip eslint
[features.frontend]
enabled = true

# --- Python ------------------------------------------------------------------
# uv, pyright, basedpyright, httpie
[features.python]
enabled = true

# --- Go ----------------------------------------------------------------------
# go toolchain, gopls, golangci-lint
[features.go]
enabled = false

# --- Rust --------------------------------------------------------------------
# rustup, cargo-nextest, cargo-watch, cargo-binstall
[features.rust]
enabled = true

# --- Emacs -------------------------------------------------------------------
# emacs, sqlite, imagemagick + dotfiles config
[features.emacs]
enabled = true

# --- Helix -------------------------------------------------------------------
# helix, marksman + dotfiles config
[features.helix]
enabled = true

# --- AI tools ----------------------------------------------------------------
# claude-code, opencode, pi, codex
[features.ai]
enabled = true

# --- Tiling WM ---------------------------------------------------------------
# macOS: aerospace  |  Linux: niri
[features.tiling]
enabled = true

# --- Keyboard manager --------------------------------------------------------
# macOS: karabiner-elements  |  Linux: xremap
[features.keyboard]
enabled = true

# --- Terminal ----------------------------------------------------------------
# ghostty
[features.terminal]
enabled = true

# --- Settings ----------------------------------------------------------------
[settings]
layout = "colemak" # colemak | qwerty

# --- Dotfiles ----------------------------------------------------------------
# source is optional: kaizen finds it via `chezmoi source-path`
# specify only when initialising chezmoi from a URL:
# source = "https://github.com/user/dotfiles"
[dotfiles]
backend = "chezmoi"
