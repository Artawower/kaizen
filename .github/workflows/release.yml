name: Release macOS binaries

on:
  push:
    branches:
      - master
    paths:
      - crates/kaizen-cli/Cargo.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          current_version=$(python -c "import tomllib; print(tomllib.load(open('crates/kaizen-cli/Cargo.toml', 'rb'))['package']['version'])")

          previous_version=""
          before="${{ github.event.before }}"

          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            tmp=$(mktemp)
            if git show "$before:crates/kaizen-cli/Cargo.toml" > "$tmp" 2>/dev/null; then
              previous_version=$(python -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1], 'rb'))['package']['version'])" "$tmp")
            fi
            rm -f "$tmp"
          fi

          release_workflow_changed=false
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "$before" HEAD -- .github/workflows/release.yml | grep -q .; then
              release_workflow_changed=true
            fi
          fi

          changed=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$current_version" != "$previous_version" ] || [ "$release_workflow_changed" = "true" ]; then
            changed=true
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      COPYFILE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build kaizen
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          clang="$(xcrun --find clang)"
          sdk_path="$(xcrun --show-sdk-path)"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="$clang"
          export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER="$clang"
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-L $sdk_path/usr/lib"
          cargo build --release --bin kaizen --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "target/${{ matrix.target }}/release/kaizen" release/kaizen
          tar -C release -czf "release/kaizen-${{ matrix.target }}.tar.gz" kaizen
          rm release/kaizen

      - uses: actions/upload-artifact@v4
        with:
          name: kaizen-${{ matrix.target }}
          path: release/kaizen-${{ matrix.target }}.tar.gz

  release:
    needs:
      - version
      - build
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kaizen-*
          merge-multiple: true
          path: release

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum release/*.tar.gz > release/kaizen-sha256.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Kaizen v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/kaizen-aarch64-apple-darwin.tar.gz
            release/kaizen-x86_64-apple-darwin.tar.gz
            release/kaizen-sha256.txt
