[aerospace]
description = "Aerospace tiling WM for macOS"
dotfiles = ["dotfiles/dot_config/aerospace"]
archive = true
platforms = ["macos"]
taps = ["nikitabobko/tap"]
cask = ["nikitabobko/tap/aerospace"]

[glazewm]
description = "GlazeWM tiling WM"
dotfiles = ["dotfiles/dot_glzr"]
platforms = ["macos"]
taps = ["glzr-io/tap"]
cask = ["glzr-io/tap/glazewm", "glzr-io/tap/zebar"]

[hypr]
description = "Hyprland Wayland compositor"
dotfiles = ["dotfiles/dot_config/hypr"]
platforms = ["linux"]
dnf = ["hyprland"]
archive = true

[komorebi]
description = "Komorebi tiling WM for macOS"
archive = true
dotfiles = ["dotfiles/dot_config/komorebi"]
platforms = ["macos"]
taps = ["lgug2z/tap", "koekeishiya/formulae", "FelixKratz/formulae"]
brew = ["lgug2z/tap/komorebi-for-mac", "koekeishiya/formulae/skhd", "FelixKratz/formulae/borders"]

[mangowm]
description = "MangoWM scrolling Wayland compositor for Fedora"
dotfiles = ["dotfiles/dot_config/mango"]
platforms = ["linux"]
distributions = ["fedora", "fedora-asahi-remix"]
post_install = "features/hooks/mangowm/post_install.py"

[niri]
description = "Niri scrolling Wayland compositor for Linux"
dotfiles = ["dotfiles/dot_config/niri"]
platforms = ["linux"]
dnf = ["niri"]

[rift]
description = "Rift tiling window manager for macOS"
dotfiles = ["dotfiles/dot_config/rift"]
platforms = ["macos"]
taps = ["acsandmann/tap"]
brew = ["acsandmann/tap/rift"]

[wayland]
description = "Shared Wayland desktop utilities"
dotfiles = ["dotfiles/dot_config/noctalia", "dotfiles/dot_local/share/noctalia", "dotfiles/dot_config/cava", "dotfiles/dot_config/autostart", "dotfiles/dot_config/systemd"]
platforms = ["linux"]
dnf = ["brightnessctl", "cliphist", "grim", "playerctl", "slurp", "wf-recorder", "wireplumber", "wl-clipboard", "xdg-desktop-portal-wlr", "ydotool"]

[yabai]
description = "yabai tiling WM for macOS"
dotfiles = ["dotfiles/dot_config/yabai", "dotfiles/dot_config/skhd", "dotfiles/dot_config/borders"]
platforms = ["macos"]
taps = ["koekeishiya/formulae", "FelixKratz/formulae"]
brew = ["koekeishiya/formulae/yabai", "koekeishiya/formulae/skhd", "FelixKratz/formulae/borders"]
