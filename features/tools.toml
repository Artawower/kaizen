[ai]
description = "AI coding agents and tooling"
brew = ["podman"]
cask = ["claude-code"]
dnf = ["podman"]
apt = ["podman"]
tools = {"go:github.com/MichaelKinsy/PiG/cmd/pig" = "latest", "npm:@earendil-works/pi-coding-agent" = "latest", "npm:@playwright/cli" = "0.1.22", "npm:skills" = "latest"}

[api]
description = "API client tools"
platforms = ["macos"]
cask = []

[containers]
description = "Container and VM tooling"
cask = ["orbstack"]
dnf = ["podman", "podman-compose"]
apt = ["podman", "podman-compose"]

[database]
description = "Database GUI tools"
cask = ["db-browser-for-sqlite", "mongodb-compass"]
dnf = ["sqlitebrowser"]
apt = ["sqlitebrowser"]

[hunk]
description = "Hunk diff viewer configuration experiment"
dotfiles = ["dotfiles/dot_config/hunk"]
archive = true

[terminal]
description = "Terminal, TUI tools, and shell"
taps = ["muxy-app/tap"]
brew = ["ghostty", "herdr", "yazi", "starship", "zoxide", "eza", "fastfetch", "direnv", "nushell"]
cask = ["ghostty"]
dnf = ["herdr", "yazi", "starship", "zoxide", "eza", "fastfetch", "direnv", "nushell"]
apt = ["herdr", "yazi", "starship", "zoxide", "eza", "fastfetch", "direnv", "nushell"]
flatpak = ["com.mitchellh.ghostty"]
tools = {"npm:typescript-language-server" = "latest", "npm:vscode-langservers-extracted" = "4.10.0", "npm:yaml-language-server" = "latest", "npm:@github/copilot-language-server" = "1.554.0", "cargo:kdlfmt" = "latest", "cargo:codebook-lsp" = "latest", "npm:lua-fmt" = "2.6.0", "cargo:runner-run" = "latest"}
post_install = "features/hooks/terminal/post_install.py"

[wezterm]
description = "WezTerm terminal configuration experiment"
dotfiles = ["dotfiles/dot_config/wezterm"]
archive = true

[zellij]
description = "Zellij multiplexer configuration experiment"
dotfiles = ["dotfiles/dot_config/zellij"]
archive = true

[xonsh]
description = "Xonsh Python-powered shell"
dotfiles = ["dotfiles/dot_config/xonsh"]
brew = ["xonsh"]
dnf = ["xonsh", "python3-pip"]
apt = ["xonsh", "python3-pip"]
post_install = "features/hooks/xonsh/post_install.py"
archive = true

[vcs]
description = "Version control tooling"
brew = ["git", "gh", "jj", "git-delta", "gnupg", "pinentry-mac"]
dnf = ["git", "gh", "jj", "git-delta", "gnupg2", "pinentry"]
apt = ["git", "gh", "jj", "git-delta", "gnupg2", "pinentry-gnome3"]
tools = {"cargo:gitu" = "latest", "github:idursun/jjui" = "latest", "npm:git-trim" = "0.3.1", "github:agavra/tuicr" = "latest"}
