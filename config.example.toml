[keyboard]
shortcut_keys = "logical_characters"
adaptation = "Preserve shortcut characters in the configured Latin layout. Translate physical key codes where necessary, including Karabiner; do not substitute QWERTY key positions."
bindings = "Maintain bindings directly in application configs, without shortcut-generation templates or a runtime shortcut registry."
alias_policy = "Use Russian aliases for command bindings and navigation, preserving sequences, modifiers and Shift; never transliterate inserted text."

[keyboard.aliases.ru]
"`" = "ё"
q = "й"
w = "ц"
f = "у"
p = "к"
g = "е"
j = "н"
l = "г"
u = "ш"
y = "щ"
