[terminal]
shell = "nu"
multiplexer = "tuios"
completion = { provider = "carapace", required = true, source = "https://github.com/carapace-sh/carapace" }

[ui]
font_size = 14
workspaces = [
  "SOC",
  "TRM",
  "WEB",
  "DEV",
  "ENT",
  "THR",
  "STU",
  "AI",
  "PRD",
]

[ui.theme]
light = "catppuccin-latte"
dark = "catppuccin-mocha"
auto_switch = true

[ui.wallpaper]
directory = "~/Pictures/Wallpapers"
directory_light = "~/Pictures/Wallpapers/Light"
directory_dark = "~/Pictures/Wallpapers/Dark"

